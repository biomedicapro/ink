<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Ink Screen</title>

<style>
  :root {
    --bg: #030303;
    --text: #c9c9c1;
    --grain: rgba(255,255,255,.025);
  }

  :root.day {
    --bg: #d8d6c8;
    --text: #1d1d1a;
    --grain: rgba(0,0,0,.035);
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, var(--grain) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, var(--grain) 0 1px, transparent 1px),
      linear-gradient(135deg, rgba(255,255,255,.018), rgba(0,0,0,.04));
    background-size: 3px 3px, 4px 4px, 100% 100%;
    opacity: .7;
  }

  .note {
    position: fixed;
    top: 14px;
    right: 16px;
    max-width: 160px;
    font-size: 10px;
    line-height: 1.35;
    letter-spacing: .03em;
    opacity: .55;
    text-align: right;
  }

  .toggle, .fs {
    position: fixed;
    right: 16px;
    width: 28px;
    height: 28px;
    border: 1px solid currentColor;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    opacity: .55;
  }

  .toggle { top: 44px; }
  .fs { top: 80px; }

  .toggle:hover, .fs:hover {
    opacity: .9;
  }
</style>
</head>

<body>
  <p class="note">
    tinta electrónica<br>
    silencio visual
  </p>

  <button class="toggle" id="toggle" title="Cambiar modo">◐</button>
  <button class="fs" id="fs" title="Pantalla completa (F)">⛶</button>

  <script>
    const btn = document.getElementById('toggle');
    const fsBtn = document.getElementById('fs');

    // 🌗 Modo día/noche
    btn.addEventListener('click', () => {
      document.documentElement.classList.toggle('day');
      btn.textContent = document.documentElement.classList.contains('day')
        ? '◑'
        : '◐';
    });

    // 🖥️ Fullscreen
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    fsBtn.addEventListener('click', toggleFullscreen);

    // ⌨️ Atajo teclado
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // 🔁 Cambiar icono según estado
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '🡼' : '⛶';
    });
  </script>
</body>
</html>
